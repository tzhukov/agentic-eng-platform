replicaCount: 1

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

persistentVolume:
  enabled: false

config:
  global:
    resolve_timeout: 5m
    smtp_smarthost: 'smtp.mailtrap.io:2525'
    smtp_from: 'alertmanager@agentic.local'
    smtp_require_tls: false
  route:
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 1h
    receiver: 'email-notifications'
  receivers:
    - name: 'email-notifications'
      email_configs:
        - to: 'sre-team@agentic.local'
          send_resolved: true
