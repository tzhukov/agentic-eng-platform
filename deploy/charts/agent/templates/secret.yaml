apiVersion: v1
kind: Secret
metadata:
  name: agent-observability-keys
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # These are pre-defined keys we'll force into LangFuse and use in the Agent
  LANGFUSE_PUBLIC_KEY: "pk-lf-dev-123456789"
  LANGFUSE_SECRET_KEY: "sk-lf-dev-123456789"
  LANGFUSE_HOST: "http://agent-stack-langfuse-web:3000"
  E2B_API_KEY: {{ .Values.agent.e2b_api_key | quote }}
  GOOGLE_API_KEY: {{ .Values.agent.google_api_key | quote }}
  GROQ_API_KEY: {{ .Values.agent.groq_api_key | quote }}
